
# Demo dbt project: builds reporting tables on top of the lead-assignment pipeline.
#
#   demo_raw.sales_people          (Excel, as-is)                  \
#   demo_stg.leads                 (sql/01_unify_leads.sql)         >-- staging views (demo_stg) --> marts (demo_mart)
#   demo_stg.lead_assignments      (python_ipynb/assign_leads.py)  /
name: 'docs_demo'
version: '1.0.0'

# Connection profile, see profiles.yml (values come from the DB_* env vars in .env)
profile: 'docs_demo_postgres'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Schemas and materializations are set in each model with {{ config(...) }},
# as in the repo template (dwh_ch/transf_dbt).
