
# Demo dbt project: builds reporting tables on top of the lead-assignment pipeline.
# Everything lives in the DB_NAME database (ClickHouse):
#
#   sales_people       (raw, imported from Postgres)   \
#   leads_clean        (python_ipynb/basic_transf.py)   \
#   leads_rejected     (python_ipynb/basic_transf.py)   /-- staging views (stg_*) --> marts (mart_*)
#   lead_assignments   (python_ipynb/assign_leads.py)  /
#
# sql/04_consolidate_leads_and_sales.sql builds the same objects in plain SQL, without dbt.
name: 'intelek_quickstart'
version: '1.0.0'

# Connection profile, see profiles.yml (values come from the DB_* env vars in .env)
profile: 'intelek_quickstart_clickhouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Materializations are set in each model with {{ config(...) }}.
