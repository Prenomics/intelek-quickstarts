version: 2

models:
  - name: stg_sales_people
    description: "Sales people with normalized column names; languages and specialties as text arrays"
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
      - name: max_open_leads
        data_tests: [not_null]

  - name: stg_leads
    description: "Clean leads (one row per lead, one lead per e-mail)"
    columns:
      - name: lead_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [unique]
      - name: preferred_language
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['es', 'ca', 'en', 'fr', 'de', 'pt']

  - name: stg_lead_status
    description: "Current commercial status per lead (latest row of lead_status)"
    columns:
      - name: lead_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'contacted', 'interested', 'converted']

  - name: stg_leads_rejected
    description: "Leads that cannot be assigned, with the reason"
    columns:
      - name: lead_id
        data_tests: [unique]
      - name: rejection_reason
        data_tests: [not_null]

  - name: stg_lead_assignments
    description: "Lead -> seller assignments produced by the Python step"
    columns:
      - name: lead_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_leads')
                field: lead_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_sales_people')
                field: seller_id
