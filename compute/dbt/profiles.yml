# dbt reads this file from the project folder (no need to copy it to ~/.dbt).
# It holds no secrets: every value comes from an environment variable.
#   Locally:  load the repo's .env into your shell (see compute/README.md)
#   Intelek:  expose the secret object keys as environment variables (same names)
docs_demo_postgres:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT', '5432') | as_number }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_NAME') }}"
      schema: demo_mart        # default schema; models override it with config(schema=...)
      threads: 4
